[project]
name = "comfyui-psd-layers"
description = "Load PSD / save PSD nodes with an interactive layer panel: load PSD or PSB files layer by layer (composite + per-layer image/mask outputs, all Photoshop blend modes), and save ByteDance Seedream layer PSD files with embedded smart-object layers. No Photoshop required."
version = "1.0.5"
license = { file = "LICENSE" }
authors = [{ name = "Hyeongjik Song", email = "coeyes@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["psd-tools[composite]>=1.18.0", "pillow", "numpy"]

[project.urls]
Repository = "https://github.com/coeyes/ComfyUI-PSD-Layers"
# BugTracker = "https://github.com/coeyes/ComfyUI-PSD-Layers/issues"

[tool.comfy]
# registry.comfy.org 에서 생성한 Publisher ID 로 교체할 것
PublisherId = "coeyes"
DisplayName = "PSD Layers"
Icon = "https://raw.githubusercontent.com/coeyes/ComfyUI-PSD-Layers/main/icon.png"
